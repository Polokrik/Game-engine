<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les secrets de la mémoire</title>
<style>html,body{height:100%;margin:0}#jeu{height:100%}
.qz{--trait:color-mix(in srgb,var(--texte) 18%,transparent);--doux:color-mix(in srgb,var(--texte) 72%,var(--fond));--ok:#2FA36B;--ko:#E5484D;
  box-sizing:border-box;height:100%;overflow:auto;background:var(--fond);color:var(--texte);font-family:var(--police);font-size:16px;line-height:1.45;container-type:inline-size;outline:none}
.qz *{box-sizing:border-box}
.qz p,.qz h1,.qz h2,.qz ol,.qz ul{margin:0}
.qz-cadre{max-width:1120px;min-height:100%;margin:0 auto;padding:24px 20px 32px;display:flex;flex-direction:column}
.qz-btn{font:inherit;font-weight:600;color:var(--texte);background:transparent;border:1.5px solid var(--trait);border-radius:var(--rayon);padding:11px 18px;cursor:pointer;transition:transform .08s,border-color .15s}
.qz-btn:hover:not(:disabled){border-color:var(--accent)}
.qz-btn:active:not(:disabled){transform:translateY(1px)}
.qz-btn:disabled{opacity:.4;cursor:not-allowed}
.qz-principal{background:var(--accent);border-color:var(--accent);color:var(--sur-accent);padding:12px 24px}
.qz-principal:hover:not(:disabled){filter:brightness(1.07)}
.qz :focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.qz-principal:focus-visible{outline-color:var(--texte)}
.qz-etiquette{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}

.qz-accueil,.qz-fin{margin:auto 0;padding:24px 0;display:flex;flex-direction:column;align-items:flex-start;gap:18px;max-width:720px}
.qz-accueil h1{font-size:clamp(30px,6cqi,54px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.qz-accroche{font-size:18px;color:var(--doux);max-width:58ch}
.qz-regles{list-style:none;padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:var(--carte);border-radius:var(--rayon);width:100%}
.qz-regles li{padding-left:18px;position:relative}
.qz-regles li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.qz-logo-grand{max-height:var(--logo-h,64px);max-width:min(100%,calc(var(--logo-h,64px) * 5));object-fit:contain}
.qz-vide{background:var(--carte);padding:14px 16px;border-radius:var(--rayon)}

.qz-jeu{display:flex;flex-direction:column;gap:20px;flex:1}
.qz-entete{display:flex;align-items:center;gap:12px;min-height:36px}
.qz-logo{max-height:min(56px,calc(var(--logo-h,64px) * .5));max-width:min(40%,calc(var(--logo-h,64px) * 2.5));object-fit:contain}
.qz-titre-court{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qz-chrono{font-variant-numeric:tabular-nums;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--trait)}
.qz-urgent{border-color:var(--ko);color:var(--ko)}
.qz-plateau{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:28px;align-items:start}
.qz-principale{display:flex;flex-direction:column;gap:16px;min-width:0}
.qz-position{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font-size:14px;color:var(--doux);font-variant-numeric:tabular-nums}
.qz-gain-actuel{font-weight:700;color:var(--accent)}
.qz-enonce{font-size:clamp(20px,3.4cqi,30px);line-height:1.22;letter-spacing:-.01em;text-wrap:balance;padding:4px 0 6px}
.qz-indice{background:var(--carte);border-left:4px solid var(--accent);padding:10px 14px;border-radius:calc(var(--rayon) / 2)}
.qz-reponses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qz-rep{font:inherit;color:var(--texte);text-align:left;background:var(--carte);border:2px solid transparent;border-radius:var(--rayon);padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;min-height:64px;transition:border-color .15s,transform .08s}
.qz-rep:hover:not(:disabled){border-color:var(--trait)}
.qz-rep:active:not(:disabled){transform:scale(.99)}
.qz-lettre{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:calc(var(--rayon) * .6);background:color-mix(in srgb,var(--texte) 12%,transparent);font-weight:700}
.qz-rep-texte{flex:1;min-width:0;overflow-wrap:anywhere}
.qz-marque{flex:none;font-weight:700;font-size:20px}
.qz-choisie{border-color:var(--accent)}
.qz-choisie .qz-lettre{background:var(--accent);color:var(--sur-accent)}
.qz-rep:disabled{cursor:default}
.qz-masquee{opacity:.28}
.qz-masquee .qz-rep-texte{text-decoration:line-through}
.qz-neutre{opacity:.55}
.qz-bonne{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 24%,var(--carte))}
.qz-bonne .qz-lettre{background:var(--ok);color:#fff}
.qz-fausse{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 22%,var(--carte))}
.qz-fausse .qz-lettre{background:var(--ko);color:#fff}
.qz-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.qz-jokers{display:flex;flex-wrap:wrap;gap:8px}
.qz-joker{padding:9px 14px;font-size:14.5px}
.qz-reste{opacity:.7;font-variant-numeric:tabular-nums}
.qz-retour{background:var(--carte);border-radius:var(--rayon);padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;border-top:4px solid var(--trait)}
.qz-retour-ok{border-top-color:var(--ok)}
.qz-retour-ko{border-top-color:var(--ko)}
.qz-retour-titre{font-size:19px;font-weight:700}
.qz-info{display:flex;flex-direction:column;gap:4px;max-width:68ch}
.qz-source{font-size:13px;color:var(--doux)}
.qz-suite{color:var(--doux);font-variant-numeric:tabular-nums}

.qz-echelle{position:relative;background:var(--carte);border-radius:var(--rayon);padding:10px;max-height:560px;overflow:auto}
.qz-echelle ol{list-style:none;padding:0;display:flex;flex-direction:column;gap:3px}
.qz-palier{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-radius:calc(var(--rayon) * .5);font-variant-numeric:tabular-nums;color:var(--doux);border:1.5px solid transparent}
.qz-palier-n{width:1.6em;text-align:right;font-size:13px;opacity:.75}
.qz-palier-v{flex:1;font-weight:600}
.qz-palier-s{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.qz-surete .qz-palier-v{color:var(--texte)}
.qz-acquis{color:var(--texte);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.qz-courant{background:var(--accent);color:var(--sur-accent)}
.qz-courant .qz-palier-v,.qz-courant .qz-palier-s{color:var(--sur-accent)}
.qz-enjeu{border-color:var(--accent);color:var(--texte)}

.qz-fin{max-width:780px}
.qz-gain-final{font-size:clamp(40px,9cqi,80px);line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.qz-score{font-size:17px;font-variant-numeric:tabular-nums}
.qz-memo{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:10px}
.qz-memo h2{font-size:20px}
.qz-memo ol{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.qz-memo-item{display:flex;gap:12px;background:var(--carte);border-radius:var(--rayon);padding:12px 14px}
.qz-memo-item>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.qz-memo-marque{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-weight:700;font-size:14px;background:color-mix(in srgb,var(--texte) 14%,transparent)}
.qz-memo-marque.qz-ok{background:var(--ok);color:#fff}
.qz-memo-q{font-size:14px;color:var(--doux)}
.qz-memo-info{font-size:14.5px}

.qz-son{padding:6px 12px;font-size:13.5px;flex:none}
.qz-fin>.qz-son{align-self:flex-end}
.qz-doux{color:var(--doux)}
.qz-choix-son{display:flex;flex-direction:column;gap:14px;width:100%}
.qz-avis-son{background:var(--carte);border-left:4px solid var(--accent);padding:12px 14px;border-radius:calc(var(--rayon) / 2);max-width:62ch}
.qz-actions-debut{display:flex;flex-wrap:wrap;gap:10px}
.qz-suspense{background:var(--carte);border-radius:var(--rayon);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;border-top:4px solid var(--accent)}
.qz-suspense-titre{font-size:19px;font-weight:700;animation:qz-pulse 1.3s ease-in-out infinite}
@keyframes qz-pulse{50%{opacity:.45}}

@container (max-width:780px){
  .qz-plateau{grid-template-columns:minmax(0,1fr)}
  .qz-echelle{display:none}
}
@container (max-width:520px){
  .qz-cadre{padding:18px 14px 24px}
  .qz-reponses{grid-template-columns:minmax(0,1fr)}
  .qz-actions{flex-direction:column;align-items:stretch}
}
@media (prefers-reduced-motion:reduce){.qz *{transition:none!important;animation:none!important}}
</style>
</head>

      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);

function calculerEchelle(regles, n) {
  var max = Math.max(1, Math.round(Number(regles && regles.gainMax) || 0));

    if (!a.length || a[0] <= 0) return false;
    for (var k = 1; k < a.length; k++) if (a[k] <= a[k - 1]) return false;
    return true;
  }
  var lin = [];
  for (i = 1; i <= n; i++) lin.push(Math.round(max * i / n));
  if (!croissante(lin)) { lin = []; for (i = 1; i <= n; i++) lin.push(i); }
  if (regles && regles.progression === "acceleree" && n > 1 && max >= 100) {
    var k10 = Math.min(4, Math.floor(Math.log(max) / Math.LN10 + 1e-9) - 1);
    var q = Math.pow(1 / Math.pow(10, k10), 1 / (n - 1));
    var pas = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 7.5, 8, 10];
    /* On tente d'abord des montants très ronds ; si deux paliers se confondent

    for (var finesse = 0; finesse < 3; finesse++) {
      var geo = [];
      for (i = 1; i <= n; i++) {
        if (i === n) { geo.push(max); break; }
        var v = max * Math.pow(q, n - i);
        var e = Math.pow(10, Math.floor(Math.log(v) / Math.LN10 + 1e-9));

      }
      if (croissante(geo)) return geo;
    }

}

  }
  function jouer(cle, auFin) {
    var a = sonActif ? audios[cle] : null;
    arreterSons();
    if (!a) { if (auFin) auFin(); return; }
    sonCourant = cle;
    var fini = false;
    function terminer() { if (fini) return; fini = true; a.onended = null; if (auFin) auFin(); }
    try {
      a.volume = volumeSon; a.currentTime = 0; a.onended = terminer;
      var pr = a.play();
      if (pr && pr.catch) pr.catch(terminer);
    } catch (e) { terminer(); }
  }
  /* Coupe en douceur le son en cours (passage à la question suivante), sans bloquer l'écran. */
  function estomper(duree) {
    var actifs = CLES_SONS.map(function (k) { return audios[k]; }).filter(function (a) { return a && !a.paused && !a.ended; });
    if (!actifs.length) return;
    if (fonduSortie) clearInterval(fonduSortie);
    var pas = 50, total = Math.max(1, Math.round(duree / pas)), i = 0;
    fonduSortie = setInterval(function () {
      i++;
      if (i >= total) { arreterSons(); return; }
      actifs.forEach(function (a) { try { a.volume = Math.max(0, volumeSon * (1 - i / total)); } catch (e) {} });
    }, pas);
  }
  function jouerSuspense(auFin) {
    var fini = false;
    function fin() { if (fini) return; fini = true; arreterSons(); auFin(); }
    etat.sauterSuspense = fin;
    jouer("suspens", fin);
    if (suspenseMax > 0 && audios.suspens) {
      minuteurSuspense = setTimeout(function () {
        minuteurSuspense = null;
        var v = volumeSon;
        fondu = setInterval(function () {
          v -= volumeSon / 8;
          if (v <= 0.01) fin();
          else { try { audios.suspens.volume = Math.max(0, v); } catch (e) {} }
        }, 100);
      }, suspenseMax * 1000);
    }
  }
  function basculerSon() {
    sonActif = !sonActif;
    if (sonActif) preparerSons();
    else {
      arreterSons();
      if (etat && etat.suspense && etat.sauterSuspense) { etat.sauterSuspense(); return; }
    }
    rendre(false);
    var b = racine.querySelector("[data-son]");
    if (b) { try { b.focus({ preventScroll: true }); } catch (e) {} }
  }
  function boutonSon() {
    if (!aSons) return null;
    return el("button", {
      class: "qz-btn qz-son", type: "button", "data-son": "1",
      "aria-pressed": sonActif ? "true" : "false",
      title: sonActif ? "Couper le son" : "Activer le son",
      text: sonActif ? "Son activé" : "Son coupé", onclick: basculerSon
    });
  }
  function demarrer(avecSon) {
    sonActif = !!avecSon;
    if (sonActif) preparerSons();
    signaler("debut", { total: n, son: sonActif });
    ouvrirQuestion(0);
    rendre(true);
    jouer("lancement");
  }
  function vueChoixSon() {
    return el("div", { class: "qz-choix-son" }, [
      el("p", { class: "qz-avis-son" }, [
        el("strong", { text: "Ce jeu comporte des effets sonores. " }),
        "Ils sont facultatifs : commencez sans le son si vous préférez le silence. Vous pourrez aussi les couper à tout moment avec le bouton « Son » en haut de l'écran."
      ]),
      el("div", { class: "qz-actions-debut" }, [
        el("button", { class: "qz-btn qz-principal", type: "button", "data-focus": "1", text: "Commencer avec le son", onclick: function () { demarrer(true); } }),
        el("button", { class: "qz-btn", type: "button", text: "Commencer sans le son", onclick: function () { demarrer(false); } })
      ])
    ]);
  }

  function estSecurite(niv) { return pasSecu > 0 && niv > 0 && niv < n && niv % pasSecu === 0; }
  function montant(niv) { return niv <= 0 ? 0 : echelle[Math.min(niv, n) - 1]; }
  function fmt(v) { return Number(v).toLocaleString("fr-FR") + (regles.unite ? " " + regles.unite : ""); }
  function signaler(type, d) {
    if (typeof options.onEvenement === "function") { try { options.onEvenement(type, d || {}); } catch (e) {} }
  }
  function melanger(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function arreterChrono() { if (minuterie) { clearInterval(minuterie); minuterie = null; } }

  function nouvellePartie() {
    arreterChrono();
    arreterSons();
    etat = {
      ecran: "accueil", i: 0, niveau: 0, plancher: 0, terminee: false, suspense: false, sauterSuspense: null,
      jokers: { moitie: Number(jk.moitie) || 0, indice: Number(jk.indice) || 0, passer: Number(jk.passer) || 0 },
      resultats: [],
      ordre: questions.map(function (q) { return regles.melangerReponses === false ? q.rep.slice() : melanger(q.rep); }),
      choix: null, valide: false, masquees: [], indiceVisible: false, reste: 0, bilan: null
    };
  }
  function appliquer(ok) {
    if (ok) {
      etat.niveau = Math.min(n, etat.niveau + 1);
      if (estSecurite(etat.niveau)) etat.plancher = Math.max(etat.plancher, etat.niveau);
    } else if (modeErreur === "descend") etat.niveau = Math.max(etat.plancher, etat.niveau - 1);
    else if (modeErreur === "securite") etat.niveau = etat.plancher;
    else if (modeErreur === "fin") { etat.niveau = etat.plancher; etat.terminee = true; }
  }
  function ouvrirQuestion(i) {
    arreterChrono();
    etat.ecran = "question"; etat.i = i; etat.choix = null; etat.valide = false;
    etat.masquees = []; etat.indiceVisible = false; etat.bilan = null;
    if (chrono > 0) {
      etat.reste = chrono;
      minuterie = setInterval(function () {
        etat.reste--;
        if (chronoEl) {
          chronoEl.textContent = etat.reste + " s";
          chronoEl.className = "qz-chrono" + (etat.reste <= 5 ? " qz-urgent" : "");
        }
        if (etat.reste <= 0) conclure("temps");
      }, 1000);
    }
  }
  function conclure(motif) {
    arreterChrono();
    /* Suspense avant le verdict : dernière question, ou question qui mène à un palier de sécurité. */
    var enjeu = motif === "reponse" && sonActif && audios.suspens && (etat.i + 1 >= n || estSecurite(etat.niveau + 1));
    if (!enjeu) { reveler(motif); return; }
    etat.suspense = true;
    rendre(true);
    jouerSuspense(function () { etat.suspense = false; etat.sauterSuspense = null; reveler(motif); });
  }
  function reveler(motif) {
    var rep = etat.ordre[etat.i];
    var ok = motif === "reponse" && etat.choix != null && rep[etat.choix].bonne;
    var avant = etat.niveau;
    if (motif !== "passe") appliquer(ok);
    etat.valide = true;
    etat.bilan = { ok: ok, motif: motif, avant: avant, apres: etat.niveau };
    etat.resultats[etat.i] = { ok: ok, passe: motif === "passe" };
    signaler("reponse", { question: etat.i + 1, total: n, correcte: ok, motif: motif, gain: montant(etat.niveau) });
    rendre(true);
    if (motif === "passe") arreterSons();
    else if (ok) jouer(etat.i + 1 >= n && audios.jackpot ? "jackpot" : "correct");
    else jouer("faux");
  }
  function suivante() {
    if (etat.terminee || etat.i + 1 >= n) terminer();
    else { estomper(450); ouvrirQuestion(etat.i + 1); rendre(true); }
  }
  function terminer() {
    arreterChrono();
    if (sonCourant !== "jackpot") estomper(450);
    etat.ecran = "fin";
    var bonnes = etat.resultats.filter(function (r) { return r && r.ok; }).length;
    signaler("fin", { gain: montant(etat.niveau), palier: etat.niveau, bonnes: bonnes, total: n, scorePourcent: n ? Math.round(100 * bonnes / n) : 0 });
    rendre(true);
  }

  /* ---------- vues ---------- */
  function logo(cls) { return theme.logo ? el("img", { class: cls, src: theme.logo, alt: "" }) : null; }

  function vueAccueil() {
    if (!n) {
      return el("div", { class: "qz-accueil" }, [
        logo("qz-logo-grand"),
        el("h1", { text: meta.titre || "Quiz" }),
        el("p", { class: "qz-vide", text: "Aucune question complète pour l'instant. Ajoutez un énoncé, au moins deux réponses et cochez la bonne." })
      ]);
    }
    var regle = {
      descend: "Une erreur vous fait redescendre d'un palier.",
      securite: "Une erreur vous ramène au dernier palier de sécurité.",
      reste: "Une erreur ne vous fait rien perdre.",
      fin: "Une erreur met fin à la partie."
    }[modeErreur];
    var liste = [
      n + (n > 1 ? " questions, un palier par bonne réponse." : " question."),
      "Jusqu'à " + fmt(echelle[n - 1]) + " à gagner.",
      regle
    ];
    if (pasSecu > 0 && n > pasSecu) liste.push("Tous les " + pasSecu + " paliers, votre gain est mis en sécurité.");
    var j = [];
    if (jk.moitie > 0) j.push(jk.moitie + " × 50/50");
    if (jk.indice > 0) j.push(jk.indice + " × indice");
    if (jk.passer > 0) j.push(jk.passer + " × passer");
    if (j.length) liste.push("Vos jokers : " + j.join(", ") + ".");
    if (chrono > 0) liste.push(chrono + " secondes par question.");
    return el("div", { class: "qz-accueil" }, [
      logo("qz-logo-grand"),
      el("h1", { text: meta.titre || "Quiz" }),
      meta.sousTitre ? el("p", { class: "qz-accroche", text: meta.sousTitre }) : null,
      el("ul", { class: "qz-regles" }, liste.map(function (t) { return el("li", { text: t }); })),
      aSons ? vueChoixSon() : el("button", { class: "qz-btn qz-principal", type: "button", "data-focus": "1", text: "Commencer", onclick: function () { demarrer(false); } })
    ]);
  }

  function vueEchelle() {
    var items = [];
    for (var niv = n; niv >= 1; niv--) {
      var cls = "qz-palier";
      if (niv <= etat.niveau) cls += " qz-acquis";
      if (niv === etat.niveau) cls += " qz-courant";
      if (!etat.valide && niv === etat.niveau + 1) cls += " qz-enjeu";
      if (estSecurite(niv)) cls += " qz-surete";
      items.push(el("li", { class: cls }, [
        el("span", { class: "qz-palier-n", text: String(niv) }),
        el("span", { class: "qz-palier-v", text: fmt(echelle[niv - 1]) }),
        estSecurite(niv) ? el("span", { class: "qz-palier-s", title: "Palier de sécurité", text: "sécurité" }) : null
      ]));
    }
    return el("aside", { class: "qz-echelle", "aria-label": "Échelle des gains" }, [el("ol", {}, items)]);
  }

  function vueQuestion() {
    var q = questions[etat.i], rep = etat.ordre[etat.i];
    chronoEl = chrono > 0 && !etat.valide && !etat.suspense ? el("span", { class: "qz-chrono" + (etat.reste <= 5 ? " qz-urgent" : ""), "aria-label": "Temps restant", text: etat.reste + " s" }) : null;

    var reponses = el("div", { class: "qz-reponses", role: "group", "aria-label": "Réponses" }, rep.map(function (r, idx) {
      var cls = "qz-rep", marque = null;
      var masquee = etat.masquees.indexOf(idx) >= 0;
      if (masquee) cls += " qz-masquee";
      if (!etat.valide && etat.choix === idx) cls += " qz-choisie";
      if (etat.valide) {
        if (r.bonne) { cls += " qz-bonne"; marque = "✓"; }
        else if (etat.choix === idx) { cls += " qz-fausse"; marque = "✗"; }
        else cls += " qz-neutre";
      }
      return el("button", {
        class: cls, type: "button", disabled: etat.valide || etat.suspense || masquee,
        "aria-pressed": !etat.valide && etat.choix === idx ? "true" : "false",
        onclick: function () { etat.choix = idx; rendre(true); }
      }, [
        el("span", { class: "qz-lettre", text: LETTRES[idx] }),
        el("span", { class: "qz-rep-texte", text: r.texte }),
        marque ? el("span", { class: "qz-marque", "aria-hidden": "true", text: marque }) : null
      ]);
    }));

    var bas;
    if (etat.suspense) {
      bas = el("div", { class: "qz-suspense", role: "status" }, [
        el("p", { class: "qz-suspense-titre", text: "Verdict…" }),
        el("p", { class: "qz-doux", text: "Réponse validée. Un peu de suspense avant de savoir." }),
        el("button", { class: "qz-btn", type: "button", "data-focus": "1", text: "Passer le suspense", onclick: function () { if (etat.sauterSuspense) etat.sauterSuspense(); } })
      ]);
    } else if (!etat.valide) {
      var mauvaises = rep.map(function (r, idx) { return r.bonne ? -1 : idx; }).filter(function (x) { return x >= 0; });
      var jokers = [];
      if (jk.moitie > 0) jokers.push(el("button", {
        class: "qz-btn qz-joker", type: "button",
        disabled: etat.jokers.moitie <= 0 || etat.masquees.length > 0 || rep.length <= 2,
        onclick: function () {
          etat.jokers.moitie--;
          etat.masquees = melanger(mauvaises).slice(0, rep.length - 2);
          if (etat.masquees.indexOf(etat.choix) >= 0) etat.choix = null;
          rendre(true);
        }
      }, ["50/50 ", el("span", { class: "qz-reste", text: "×" + etat.jokers.moitie })]));
      if (jk.indice > 0) jokers.push(el("button", {
        class: "qz-btn qz-joker", type: "button",
        disabled: etat.jokers.indice <= 0 || etat.indiceVisible || !q.indice,
        title: q.indice ? null : "Pas d'indice pour cette question",
        onclick: function () { etat.jokers.indice--; etat.indiceVisible = true; rendre(true); }
      }, ["Indice ", el("span", { class: "qz-reste", text: "×" + etat.jokers.indice })]));
      if (jk.passer > 0) jokers.push(el("button", {
        class: "qz-btn qz-joker", type: "button", disabled: etat.jokers.passer <= 0,
        onclick: function () { etat.jokers.passer--; etat.choix = null; conclure("passe"); }
      }, ["Passer ", el("span", { class: "qz-reste", text: "×" + etat.jokers.passer })]));
      bas = el("div", { class: "qz-actions" }, [
        el("div", { class: "qz-jokers" }, jokers),
        el("button", { class: "qz-btn qz-principal", type: "button", disabled: etat.choix == null, "data-focus": etat.choix != null ? "1" : null, text: "Valider ma réponse", onclick: function () { conclure("reponse"); } })
      ]);
    } else {
      var b = etat.bilan, bonneIdx = 0;
      rep.forEach(function (r, idx) { if (r.bonne) bonneIdx = idx; });
      var titre = b.motif === "passe" ? "Question passée" : b.ok ? "Bonne réponse" : b.motif === "temps" ? "Temps écoulé" : "Mauvaise réponse";
      var suite;
      if (b.motif === "passe") suite = "Vous restez à " + fmt(montant(b.apres)) + ".";
      else if (b.ok) suite = "Vous atteignez le palier " + b.apres + " : " + fmt(montant(b.apres)) + "." + (estSecurite(b.apres) ? " Ce gain est maintenant en sécurité." : "");
      else if (etat.terminee) suite = "La partie s'arrête ici. Vous repartez avec " + fmt(montant(b.apres)) + ".";
      else if (b.apres < b.avant) suite = "Vous redescendez à " + fmt(montant(b.apres)) + ".";
      else suite = "Vous restez à " + fmt(montant(b.apres)) + ".";
      var dernier = etat.terminee || etat.i + 1 >= n;
      bas = el("div", { class: "qz-retour " + (b.ok ? "qz-retour-ok" : b.motif === "passe" ? "" : "qz-retour-ko"), role: "status" }, [
        el("p", { class: "qz-retour-titre" }, [el("span", { "aria-hidden": "true", text: b.ok ? "✓ " : b.motif === "passe" ? "→ " : "✗ " }), titre]),
        b.ok ? null : el("p", {}, ["La bonne réponse : ", el("strong", { text: LETTRES[bonneIdx] + ". " + rep[bonneIdx].texte })]),
        q.infoCle ? el("div", { class: "qz-info" }, [
          el("p", { class: "qz-etiquette", text: "À retenir" }),
          el("p", { text: q.infoCle }),
          q.source ? el("p", { class: "qz-source", text: "Source : " + q.source }) : null
        ]) : null,
        el("p", { class: "qz-suite", text: suite }),
        el("button", { class: "qz-btn qz-principal", type: "button", "data-focus": "1", text: dernier ? "Voir mon résultat" : "Question suivante", onclick: suivante })
      ]);
    }

    return el("div", { class: "qz-jeu" }, [
      el("header", { class: "qz-entete" }, [
        logo("qz-logo"),
        el("span", { class: "qz-titre-court", text: meta.titre || "" }),
        chronoEl,
        boutonSon()
      ]),
      el("div", { class: "qz-plateau" }, [
        el("div", { class: "qz-principale" }, [
          el("p", { class: "qz-position" }, [
            el("span", { text: "Question " + (etat.i + 1) + " sur " + n }),
            el("span", { class: "qz-gain-actuel", text: "Gain actuel : " + fmt(montant(etat.niveau)) })
          ]),
          el("h2", { class: "qz-enonce", text: q.enonce }),
          etat.indiceVisible && !etat.valide ? el("p", { class: "qz-indice" }, [el("strong", { text: "Indice : " }), q.indice]) : null,
          reponses,
          bas
        ]),
        vueEchelle()
      ])
    ]);
  }

  function vueFin() {
    var bonnes = etat.resultats.filter(function (r) { return r && r.ok; }).length;
    var vues = etat.resultats.length;
    var memo = [];
    for (var i = 0; i < vues; i++) {
      var q = questions[i], r = etat.resultats[i] || {};
      var bonne = q.rep.filter(function (x) { return x.bonne; })[0];
      memo.push(el("li", { class: "qz-memo-item" }, [
        el("span", { class: "qz-memo-marque " + (r.ok ? "qz-ok" : "qz-ko"), text: r.ok ? "✓" : r.passe ? "→" : "✗", title: r.ok ? "Réussie" : r.passe ? "Passée" : "Manquée" }),
        el("div", {}, [
          el("p", { class: "qz-memo-q", text: q.enonce }),
          el("p", { class: "qz-memo-r" }, [el("strong", { text: bonne.texte })]),
          q.infoCle ? el("p", { class: "qz-memo-info", text: q.infoCle }) : null
        ])
      ]));
    }
    return el("div", { class: "qz-fin" }, [
      boutonSon(),
      logo("qz-logo-grand"),
      el("p", { class: "qz-etiquette", text: "Partie terminée" }),
      el("h1", { class: "qz-gain-final", text: fmt(montant(etat.niveau)) }),
      el("p", { class: "qz-score", text: bonnes + (bonnes > 1 ? " bonnes réponses" : " bonne réponse") + " sur " + n + " · palier " + etat.niveau + " sur " + n }),
      meta.messageFin ? el("p", { class: "qz-accroche", text: meta.messageFin }) : null,
      el("button", { class: "qz-btn qz-principal", type: "button", "data-focus": "1", text: "Rejouer", onclick: function () { nouvellePartie(); rendre(true); } }),
      el("section", { class: "qz-memo" }, [
        el("h2", { text: "Fiche mémo" }),
        el("ol", {}, memo)
      ])
    ]);
  }

  function rendre(focaliser) {
    chronoEl = null;
    var vue = etat.ecran === "question" ? vueQuestion() : etat.ecran === "fin" ? vueFin() : vueAccueil();
    while (racine.firstChild) racine.removeChild(racine.firstChild);
    racine.appendChild(el("div", { class: "qz-cadre" }, [vue]));
    racine.scrollTop = 0;
    var ech = racine.querySelector(".qz-echelle");
    var repere = ech && (ech.querySelector(".qz-enjeu") || ech.querySelector(".qz-courant"));
    if (repere) ech.scrollTop = repere.offsetTop - ech.clientHeight / 2 + repere.offsetHeight / 2;
    if (focaliser) {
      var cible = racine.querySelector("[data-focus]") || racine;
      try { cible.focus({ preventScroll: true }); } catch (e) {}
    }
  }

  function touche(ev) {
    if (!etat || etat.ecran !== "question" || etat.valide || etat.suspense) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var k = String(ev.key || "").toLowerCase();
    var idx = "abcd".indexOf(k);
    if (idx < 0) idx = "1234".indexOf(k);
    if (k.length !== 1 || idx < 0 || idx >= etat.ordre[etat.i].length || etat.masquees.indexOf(idx) >= 0) return;
    etat.choix = idx; rendre(true);
  }
  var ecouteur = options.touchesGlobales ? doc : racine;
  ecouteur.addEventListener("keydown", touche);

  nouvellePartie();
  var dep = options.depart;
  if (dep && n) {
    if (dep.ecran === "question") {
      var cible = Math.max(0, Math.min(n - 1, Number(dep.index) || 0));
      for (var a = 0; a < cible; a++) { appliquer(true); etat.resultats[a] = { ok: true }; }
      etat.terminee = false;
      ouvrirQuestion(cible);
    } else if (dep.ecran === "fin") {
      for (var c = 0; c < n && !etat.terminee; c++) {
        var okSim = !(n > 2 && c === 1);
        appliquer(okSim); etat.resultats[c] = { ok: okSim };
      }
      etat.ecran = "fin";
    }
  }
  rendre(!!options.autoFocus);

  return { detruire: function () { arreterChrono(); arreterSons(); ecouteur.removeEventListener("keydown", touche); } };
}
mountQuiz(document.getElementById("jeu"), CONFIG, { autoFocus: true, touchesGlobales: true, onEvenement: suivi });
</script>
</body>
