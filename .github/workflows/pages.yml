name: Publier l'atelier sur GitHub Pages

# Publie UNE page (l'atelier) : le reste du dépôt (docs, assistant, sources) n'est pas servi par Pages.
# Par défaut la page est publiée AVEC les sons (décision du porteur du projet, 2026-11-25).
# Pour publier sans sons : Settings > Secrets and variables > Actions > Variables > PUBLIER_SONS = false

on:
  push:
    branches: [main]
    paths:
      - "atelier/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire la page
        env:
          PUBLIER_SONS: ${{ vars.PUBLIER_SONS }}
        run: |
          if [ "$PUBLIER_SONS" = "false" ]; then
            python3 atelier/construire.py --sans-sons --sortie _site/index.html
            if grep -q "data:audio/mpeg;base64" _site/index.html; then
              echo "Des sons se sont glissés dans la version sans sons : arrêt."
              exit 1
            fi
          else
            python3 atelier/construire.py --sortie _site/index.html
            if ! grep -q "data:audio/mpeg;base64" _site/index.html; then
              echo "Aucun son embarqué alors qu'ils devraient l'être : arrêt."
              exit 1
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub enregistre parfois l'artefact avec un léger retard : sans cette attente, la publication échoue
      # avec « No artifacts named github-pages were found ». Ne pas relancer l'exécution en boucle : cela
      # dépose plusieurs artefacts et bloque la publication. Lancer plutôt une nouvelle exécution.
      - name: Attendre l'enregistrement de l'artefact
        run: sleep 30
      - id: deploiement
        uses: actions/deploy-pages@v4
